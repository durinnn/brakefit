# KB증권 H-able — 화면 0330 「일자별실현손익(상세)」
#
# 실측: 2026-08-27 화면 캡처에서 확인한 헤더 (데이터 행은 아직 0건)
#   매매일자 | 종목명 | 구분 | 매매구분 | 체결수량 | 체결단가 | 매수단가 |
#   매수금액 | 매도금액 | 수수료 | 제세금 | 실현손익 | 수익률
#
# ★ 우리가 찾던 컬럼이 여기 다 있다 — 체결수량·체결단가·수수료·제세금.
#   거래내역(예수금 원장) 화면의 약점 3개 중 2개가 이 화면에서 해결된다.
#
# ⚠ 단, 이 화면만으로는 부족하다:
#   실현손익 화면은 **청산된 건만** 나온다. 매수만 하고 아직 안 판 종목은 없다.
#   포지션 재구성 엔진(A)은 매수 이력이 있어야 타임라인을 만들 수 있으므로
#   0112 거래내역조회(매수·매도 전부)와 **함께** 써야 한다.
#
#   → 0112 = 매매 이력의 본체 (엔진 입력)
#   → 0330 = 수수료·제세금·실현손익 검산용 (스키마 §수수료 결론을 내는 근거)

screen: "0330 일자별실현손익(상세)"
source_hint: "H-able · 화면검색에 '실현손익' → 0330 · 조회기간을 계좌개설일까지 넓힐 것"

header_anchors: ["매매일자", "종목명", "매매구분", "체결수량", "체결단가"]

columns:
  매매일자: traded_at
  종목명: name
  구분: category        # 현금/신용 등. 지금은 안 씀
  매매구분: side_text    # '매도' / '매수' 텍스트가 직접 들어있다
  체결수량: quantity
  체결단가: price
  매수단가: avg_buy_price
  매수금액: buy_amount
  매도금액: sell_amount
  수수료: fee           # ★ 원장 화면에는 없던 것
  제세금: tax           # ★ 원장 화면에는 없던 것
  실현손익: realized_pnl
  수익률: return_rate

# 이 화면은 매매구분 컬럼이 따로 있어서 판정이 단순하다
side_rules:
  - when: {side_text_contains: ["매도", "매각"]}
    side: SELL
  - when: {side_text_contains: ["매수", "매입"]}
    side: BUY

row_filters:
  drop_if_missing: [quantity, price, name]
  drop_if_text_matches: ["조회된 데이터가 없습니다", "합계", "소계", "총계", "정상적으로 조회"]

formats:
  date_formats: ["%Y-%m-%d", "%Y/%m/%d", "%Y%m%d", "%Y.%m.%d", "%Y년%m월%d일"]
  strip_chars: [",", "₩", "원", " ", "주", "%"]
  parenthesis_is_negative: true

# 종목코드는 여전히 없다 (종목명만) → resolve_tickers() 필요
absent_fields: [ticker]
