# KB증권 — 거래내역(예수금 원장) 화면
#
# 실측: 2026-08-27, kbsec.com 웹에서 받은 .xlsx
#   시트명 Sheet0 / 0행이 바로 헤더 / 안내 행 없음
#   헤더: 거래일 | 내용 | 종목명 | 수량 | 단가 | 입금/입고/매도 | 출금/출고/매수 | 예수금잔액(원)
#
# ⚠ 이 화면의 한계 (docs/parser-kb.md 참조)
#   · 종목코드가 없다 → resolve_tickers() 로 종목명에서 역매핑해야 함
#   · 수수료·세금 컬럼이 없다 → fee/tax = None 으로 두고 절대 0 으로 채우지 말 것
#   · 매매·입출금·배당이 한 표에 섞여 나온다 → row_filters 로 걸러냄
#
# 더 나은 화면(체결내역)을 찾으면 kb_execution.yaml 을 새로 만들고
# 이 파일은 폴백으로 남긴다.

screen: "거래내역(예수금 원장)"
source_hint: "kbsec.com 웹 · 또는 H-able 거래내역 화면"

# 헤더 행 탐지용 앵커 — 이 텍스트가 전부 있는 행을 헤더로 본다
header_anchors: ["거래일", "내용", "종목명", "수량", "단가"]

# 헤더 텍스트 → 내부 이름
columns:
  거래일: traded_at
  내용: note
  종목명: name
  수량: quantity
  단가: price
  "입금/입고/매도": credit      # 들어온 돈 = 매도대금
  "출금/출고/매수": debit       # 나간 돈  = 매수대금
  "예수금잔액(원)": balance     # 사용 안 함 (검산용으로만)

# 매수/매도 판정 — 위에서부터 먼저 맞는 규칙을 쓴다
side_rules:
  - when: {note_contains: ["매도", "매각"]}
    side: SELL
  - when: {note_contains: ["매수", "매입"]}
    side: BUY
  - when: {has_value: credit}     # 내용 표기가 예상 밖일 때의 폴백
    side: SELL
  - when: {has_value: debit}
    side: BUY

# 거래 행이 아닌 것 — 스킵하고 사유를 리포트에 남긴다
row_filters:
  drop_if_note_contains:
    - 입금
    - 출금
    - 이체
    - 대체
    - 배당
    - 이자
    - 세금       # 단독 세금 행 (매매 행의 세금은 별개)
    - 수수료
    - 환전
    - 예탁금
  drop_if_missing: [quantity, price, name]   # 수량·단가·종목명이 없으면 매매가 아님
  drop_if_text_matches: ["조회된 데이터가 없습니다", "합계", "소계", "총계"]

# 값 파싱
formats:
  # 날짜: 어느 게 올지 몰라서 후보를 순서대로 시도한다 (실데이터 확보되면 하나로 확정)
  date_formats: ["%Y-%m-%d", "%Y/%m/%d", "%Y%m%d", "%Y.%m.%d", "%Y년%m월%d일"]
  # 숫자: 천단위 콤마, 괄호 음수, 통화기호, 공백 제거
  strip_chars: [",", "₩", "원", " ", "주"]
  parenthesis_is_negative: true

# 이 화면이 제공하지 않는 것 — None 으로 채우고 경고를 남긴다
absent_fields: [ticker, fee, tax]
