# KB증권 H-able — 화면 0377 「종목별주문/체결집계」
#
# 실측: 2026-08-27, 실제 export 한 xlsx 의 1행 헤더
#   종목번호 | 종목명 | 매매구분 | 주문수량 | 체결수량 | 취소수량 | 미체결잔량 | 체결금액 | 체결단가
#
# ★ 종목코드(종목번호)가 있는 유일한 화면.
#   0112 로 뽑은 거래내역의 종목명 → 코드 매핑을 pykrx 없이 해결할 수 있다.
#   (사명 변경·우선주·상장폐지 종목에서 pykrx 역매핑이 깨지는 문제를 우회)
#
# ⚠ 한계
#   · 주문일자 **하루 단위**다. 기간 조회가 안 되므로 매매한 날마다 따로 뽑아야 한다
#   · 수수료·세금이 없다
#   · 주문 기준 집계라 같은 날 같은 종목의 여러 체결이 한 줄로 합쳐진다
#     → 체결단가는 평균단가다. 정밀한 타임라인이 필요하면 0112 를 쓸 것
#
# 용도: **종목코드 사전(dictionary) 만들기**. 거래 데이터의 본체로 쓰지 말 것.

screen: "0377 종목별주문/체결집계"
source_hint: "H-able 0377 · 주문일자 하루 단위 · 우측 상단 엑셀 아이콘으로 export"

header_rows: 1
record_rows: 1

header_anchors: ["종목번호", "종목명", "매매구분", "체결수량", "체결단가"]

columns:
  종목번호: ticker
  종목명: name
  매매구분: side_text
  주문수량: order_quantity
  체결수량: quantity
  취소수량: cancelled_quantity
  미체결잔량: pending_quantity
  체결금액: amount
  체결단가: price

side_rules:
  - when: {side_text_contains: ["매도", "매각"]}
    side: SELL
  - when: {side_text_contains: ["매수", "매입"]}
    side: BUY

row_filters:
  drop_if_missing: [quantity, price, name]
  drop_if_text_matches:
    - "조회할 자료가 없습니다"
    - "조회된 데이터가 없습니다"
    - 합계
    - 소계
    - 총계

formats:
  date_formats: ["%Y-%m-%d", "%Y/%m/%d", "%Y%m%d"]
  strip_chars: [",", "₩", "원", " ", "주"]
  parenthesis_is_negative: true

# ⚠ 이 화면에는 매매일자 컬럼이 아예 없다 (조회 조건의 주문일자가 곧 날짜).
#   parse() 는 traded_at 이 없으면 전부 스킵하므로,
#   build_ticker_map() 으로 종목코드 사전만 뽑아 쓴다. kb_hts.py 참조.
absent_fields: [traded_at, fee, tax]
