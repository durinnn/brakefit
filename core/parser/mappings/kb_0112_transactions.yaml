# KB증권 H-able — 화면 0112 「거래내역조회」   ★ 엔진 입력의 본체
#
# 실측: 2026-08-27 화면 캡처
#
# ⚠ 이 화면은 **헤더 2행 + 레코드 2행** 구조다. 한 거래가 두 줄에 걸쳐 있다.
#
#   [헤더1] 거래일자  거래종류  수량  거래금액  정산금액              거래세 등      소득세      양도세      대출금        유가잔고
#   [헤더2]           종목명    단가  수수료    펀드가입번호/신탁보수  농특세/부가세  지방소득세  과세기준가  신용/대출이자  예수금
#
#   [값1]  2026/08/27  전자금융입금        10,000  10,000              0    0     0
#   [값2]                           0      0                    0     0    0.00  0        10,000
#
# 즉 같은 열에 위/아래로 다른 항목이 쌓여 있다.
#   2열 = 위 '거래종류' / 아래 '종목명'
#   3열 = 위 '수량'     / 아래 '단가'
#   4열 = 위 '거래금액' / 아래 '수수료'
# 1행 = 1레코드로 읽으면 단가와 수수료가 통째로 날아간다.
#
# ★ 이 화면의 장점: 매수·매도가 전부 나오고 수수료·세금도 다 있다.
#   유일한 약점은 종목코드가 없다는 것 → resolve_tickers() 또는 0377 로 보완

screen: "0112 거래내역조회"
source_hint: >
  H-able 화면검색 '거래내역' → 0112.
  ⚠ 조회기간이 당일~당일로 기본 설정된다. 계좌개설일까지 반드시 넓힐 것.
  '간편내역' 체크 시 외화거래는 조회되지 않는다 (화면 안내문 3번).

header_rows: 2      # 헤더가 두 줄
record_rows: 2      # 한 거래도 두 줄

header_anchors: ["거래일자", "거래종류", "거래금액", "정산금액"]

columns:
  # ── 헤더 1행 ──
  거래일자: traded_at
  거래종류: note            # '전자금융입금' / '현금매수' / '현금매도' 등
  수량: quantity
  거래금액: gross_amount     # 수수료·세금 반영 전
  정산금액: amount           # ★ 실제 정산된 금액 — 이게 진짜 현금 흐름
  "거래세 등": tax_trade
  소득세: tax_income
  양도세: tax_transfer
  대출금: loan
  유가잔고: securities_balance
  # ── 헤더 2행 ──
  종목명: name
  단가: price
  수수료: fee                # ★
  "펀드가입번호/신탁보수": fund_ref
  "농특세/부가세": tax_surcharge
  지방소득세: tax_local
  과세기준가: tax_base
  "신용/대출이자": loan_interest
  예수금: cash_balance

# 세금이 5개 컬럼에 흩어져 있다 → 합산해서 tax 하나로
tax_fields: [tax_trade, tax_surcharge, tax_income, tax_local, tax_transfer]

side_rules:
  - when: {note_contains: ["매도", "매각", "출고"]}
    side: SELL
  - when: {note_contains: ["매수", "매입", "입고"]}
    side: BUY

row_filters:
  # 거래종류 실제 표기는 실데이터로 확인 필요. 지금까지 본 것: '전자금융입금'
  drop_if_note_contains:
    - 입금
    - 출금
    - 이체
    - 대체
    - 배당
    - 이자
    - 환전
    - 예탁금
    - 신탁
  drop_if_missing: [quantity, price, name]
  drop_if_text_matches:
    - "조회된 데이터가 없습니다"
    - "조회할 자료가 없습니다"
    - "정상적으로 조회"
    - 합계
    - 소계
    - 총계

formats:
  # 실측 확인: 2026/08/27 (슬래시) — 첫 번째 후보로 둔다
  date_formats: ["%Y/%m/%d", "%Y-%m-%d", "%Y%m%d", "%Y.%m.%d", "%Y년%m월%d일"]
  strip_chars: [",", "₩", "원", " ", "주", "%"]
  parenthesis_is_negative: true

absent_fields: [ticker]
