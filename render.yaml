# Render 배포 설정 — api/(FastAPI) 전용.
#
# 사용법: render.com 에서 New > Blueprint > 이 레포 연결 > 브랜치 main 선택.
# 자동으로 이 파일을 읽어서 서비스를 만든다. 수동으로 할 거면(New > Web Service):
#   Build Command : pip install uv && uv sync --extra web --frozen
#   Start Command : uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
#
# data/cache/prices/*.parquet 를 커밋해뒀기 때문에(§ .gitignore 방침), DEMO_AS_OF
# 범위 안(2026-08-18까지) 데모 엔드포인트는 배포 후에도 KRX 네트워크 장애와
# 무관하게 동작한다.

services:
  - type: web
    name: brakefit-api
    runtime: python
    plan: free
    # 프론트(Vercel)가 main 을 배포 기준으로 보고 있어서, API 도 main 으로 맞춘다
    # — 배포된 화면과 API 가 서로 다른 브랜치를 보면 데모 중에 형태가 어긋난다
    branch: main
    buildCommand: "pip install uv && uv sync --extra web --frozen"
    startCommand: "uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /api/health
